<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Prato do Dia • {{ nome_estabelecimento }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<button class="toggle-theme" onclick="document.body.classList.toggle('dark')">🌓</button>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">🍛</div>
      <div>
        <div class="brand-title">Prato do Dia</div>
        <div class="brand-sub">{{ nome_estabelecimento }}</div>
      </div>
    </div>

    <div class="kpi">
      <a class="kpi-card" href="/caixa" style="text-decoration:none; color:inherit;">
        <div class="kpi-label">Voltar</div>
        <div class="kpi-value">↩️ Caixa</div>
      </a>
      <a class="kpi-card" href="/historico" style="text-decoration:none; color:inherit;">
        <div class="kpi-label">Histórico</div>
        <div class="kpi-value">🗂️</div>
      </a>
      <a class="kpi-card" href="/logout" style="text-decoration:none; color:inherit;">
        <div class="kpi-label">Sair</div>
        <div class="kpi-value">🚪</div>
      </a>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2 style="margin-bottom:10px;">Editar prato do dia (marmitex)</h2>
    <p style="opacity:.8; margin-bottom:12px;">
      Exemplo: “Hoje: Frango grelhado + arroz + feijão + salada • R$ 16,00”
    </p>

    <form action="/prato_do_dia/salvar" method="POST">
      <label>Texto do prato do dia</label>
      <textarea name="prato_do_dia" rows="6" style="width:100%; padding:12px; border-radius:12px; font-size:16px;">{{ prato_do_dia }}</textarea>

      <button class="btn btn-primary" type="submit" style="margin-top:12px;">💾 Salvar</button>
    </form>
  </div>
</div>

</body>
</html>
